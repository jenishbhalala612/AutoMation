# ============================================================
# SearXNG Settings for AutoBlog Engine
# ============================================================
# This file configures SearXNG to expose a JSON API
# so the Python pipeline can query it for:
#   - Trending topic web results
#   - Keyword research (autocomplete + full results)
# ============================================================

use_default_settings: true

general:
  instance_name: "AutoBlog SearXNG"
  contact_url: false
  enable_metrics: true

search:
  # Allow JSON output format (required by pipeline)
  formats:
    - html
    - json
  default_lang: "en"
  autocomplete: "google"
  safe_search: 0

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "autoblog-searxng-secret-change-in-production"
  base_url: false
  image_proxy: false
  http_protocol_version: "1.1"

ui:
  static_use_hash: false
  default_locale: "en"
  query_in_title: true
  infinite_scroll: false
  center_alignment: false
  default_theme: simple

# Engines to enable (focusing on tech/AI content)
engines:
  # ── General Web Search ──────────────────────────────────
  - name: google
    engine: google
    shortcut: g
    use_mobile_ui: false

  - name: bing
    engine: bing
    shortcut: b

  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg

  - name: brave
    engine: brave
    shortcut: brave

  # ── News Sources ────────────────────────────────────────
  - name: google news
    engine: google_news
    shortcut: gn

  - name: bing news
    engine: bing_news
    shortcut: bn

  - name: hackernews
    engine: hackernews
    shortcut: hn
    categories: [it, news]

  # ── Tech / Developer Sources ────────────────────────────
  - name: github
    engine: github
    shortcut: gh
    categories: [it]

  - name: stackoverflow
    engine: stackoverflow
    shortcut: so
    categories: [it]

  - name: reddit
    engine: reddit
    shortcut: re
    categories: [social media, it]

  # ── Video / Additional ───────────────────────────────────
  - name: youtube
    engine: youtube_noapi
    shortcut: yt
    categories: [videos]

outgoing:
  request_timeout: 15.0
  max_request_timeout: 30.0
  useragent_suffix: ""
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true

# Result categories to use (aligned with AutoBlog niche)
categories_as_tabs:
  general:
    name: General
  news:
    name: News
  it:
    name: IT
  social media:
    name: Social
